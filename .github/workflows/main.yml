name: Solar System  Route-CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/testworkflow
      - main

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGODB_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}

jobs:
  unit-tests:
    name: Run Unit Test
    strategy:
      matrix:
        #node-version: [18,20,24]
        node-version: [18]
        #os: [ubuntu-latest,macos-latest]
        os: [ubuntu-latest]

    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
      
      - name: node installation
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: npm install
      
      - name: Run tests
        run: npm test

      - name: archive results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: |
            ./test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: node installation
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install npm dependencies
        run: npm install
      
      - name: Run code coverage
        continue-on-error: true
        run: npm run coverage

      - name: archive results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-results
          path: |
            ./coverage

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [code-coverage,unit-tests]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system-route:${{ github.sha }}
      
      - name: Docker Image test
        run: |
          docker images
          docker run --name solar-system-route -d \
           -p 3000:3000 \
           -e MONGO_URI='mongodb+srv://supercluster.d83jj.mongodb.net/superData' \
           -e MONGO_USERNAME=${{ vars.MONGODB_USERNAME }} \
           -e MONGO_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
           ${{ vars.DOCKER_USERNAME }}/solar-system-route:${{ github.sha }}
           sleep 5
           docker ps
           export IP_ADDRESS=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-route)
           echo $IP_ADDRESS
           wget -q -O - http://127.0.0.1:3000/live | grep live
      
      - name: Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system-route:${{ github.sha }}

  terraform:
    name: terraform deployment
    needs: docker
    runs-on: ubuntu-latest

    steps:
    -  name: checkout
        uses: actions/checkout@v7.0.1

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    - names: install terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.7.6"


    - name: initalize terraform
      run: terraform init
      working-directory: ./Terraform

    - name: validate tf
      run: terraform validate
      working-directory: ./Terraform

    - name: terraform plan
      run: terraform plan
      working-directory: ./Terraform

    - name: apply
      run: terraform apply -auto-approve
      working-directory: ./Terraform